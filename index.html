<script>
// Токен бота
const TELEGRAM_BOT_TOKEN="8608601758:AAHqKHl1UshkTT1hrB8yjhWZOpTkwTOO8oQ";

const TELEGRAM_CHAT_ID_1 = "545995986";
const TELEGRAM_CHAT_ID_2 = "1144833390";

// Универсальная функция открытия модальных окон
function openModal(type){
    let id;
    if (type === 'service') id = 'modalService';
    else if (type === 'catalog') id = 'modalCatalog';
    else if (type === 'article') id = 'modalArticle';
    else if (type === 'quiz') id = 'modalQuiz';
    
    if (id) {
        document.getElementById(id).classList.add('active');
        document.body.style.overflow='hidden';
    }
}

function closeModal(id){
    document.getElementById(id).classList.remove('active');
    document.body.style.overflow='';
}

function closeModalOutside(event, id){
    if(event.target.id === id) closeModal(id);
}

document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'){
        closeModal('modalService');
        closeModal('modalCatalog');
        closeModal('modalArticle');
        closeModal('modalQuiz');

});

// Функция для отправки сообщения на два ID
async function sendToTelegram(text) {
    const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
    
    // Отправка на первый ID
    await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID_1, text: text })
    });

    // Отправка на второй ID
    await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID_2, text: text })
    });
}

// Отправка формы на услугу

    const btn = form.querySelector('button[type="submit"]');
    const name = form.name.value.trim();
    const phone = form.phone.value.trim();
    const service = form.service.value;
    const message = form.message.value.trim();

    btn.disabled = true; btn.textContent = 'Отправка...'; status.textContent = ''; status.className = 'form-status';
    try {
        await sendToTelegram(text);
        status.textContent = '✅ Заявка отправлена! Мы свяжемся с вами.'; status.className = 'form-status success'; form.reset();

});

});

// Логика калькулятора подбора и отправка в Telegram
document.getElementById('quizForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const area = form.area.value;
    const winter = form.winter.value;
    const budget = form.budget.value;
    const name = form.name.value.trim();
    const phone = form.phone.value.trim();

    let recommendation = "";
    let recShort = "";

    if (winter === "heat_pump") {
        recommendation = "Вам подойдет тепловой насос. Это решение для полного отопления дома без газа и дров. Оставьте заявку, и мы рассчитаем мощность и стоимость под ваш дом.";
        recShort = "Тепловой насос (отопление дома). Бюджет: " + budget;
    } else if (budget === "low" && winter === "no") {
        recommendation = "Вам подойдет бюджетная модель On/Off. Она отлично справится с охлаждением. Но помните: на обогрев зимой она не рассчитана.";
        recShort = "Бюджетный On/Off (до 1000 BYN), только охлаждение.";
    } else if (budget === "mid" && winter === "no") {
        recommendation = "Отличный выбор — инверторная модель среднего класса. Она тихая, экономичная и прослужит долго.";
        recShort = "Инвертор среднего класса (1000-2000 BYN), только охлаждение.";
    } else if (winter === "yes_hard") {
        recommendation = "Вам нужна инверторная модель с зимним комплектом. Обязательно установите зимний комплект — он позволит греться даже в -20°C без риска поломки.";
        recShort = "Инвертор с зимним комплектом (до -20°C). Бюджет: " + budget;
    } else {
        recommendation = "Вам подойдет качественная инверторная модель среднего сегмента. Она обеспечит комфорт и в жару, и в межсезонье.";
        recShort = "Инвертор средний+, межсезонье. Бюджет: " + budget;
    }

    document.getElementById('quizResult').style.display = 'block';
    document.getElementById('recommendationText').textContent = recommendation;
    form.style.display = 'none';

    const text = `🎯 НОВЫЙ ЗАПРОС НА ПОДБОР!\n\n👤 Имя: ${name}\n📞 Телефон: ${phone}\n\n📐 Площадь: ${area === 'small' ? 'До 25 м²' : area === 'medium' ? '25-40 м²' : 'Более 40 м²'}\n❄️ Обогрев зимой: ${winter === 'no' ? 'Нет' : winter === 'yes_soft' ? 'До -5°C' : winter === 'yes_hard' ? 'До -20°C' : 'Тепловой насос'}\n💰 Бюджет: ${budget === 'low' ? 'До 1000' : budget === 'mid' ? '1000-2000' : 'Более 2000'}\n\n💡 Рекомендация: ${recShort}`;

    try {
        await sendToTelegram(text);
    } catch (err) {
        console.error('Ошибка отправки:', err);
    }
});

// Логика калькулятора экономии (Тепловые насосы)
const areaInput = document.getElementById('areaInput');
const calcResult = document.getElementById('calcResult');

function calculateSavings() {
    const area = parseInt(areaInput.value);
    if (!isNaN(area) && area > 0) {
        // Примерный расчет: газ 3 руб/м2, насос 1 руб/м2 (разница 2 руб/м2)
        const savings = area * 2; 
        calcResult.textContent = `Ваша примерная экономия: ~${savings} BYN в месяц`;
    } else {
        calcResult.textContent = '';
    }
}

if (areaInput) {
    areaInput.addEventListener('input', calculateSavings);
    calculateSavings(); // Расчет при загрузке
}

// Анимация появления
const revealElements=document.querySelectorAll('.reveal');
const observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible')}})},{threshold:0.1});
revealElements.forEach(el=>observer.observe(el));
</script>
